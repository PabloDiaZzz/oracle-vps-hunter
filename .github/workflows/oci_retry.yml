name: Oracle Cloud Instance Hunter

on:
  schedule:
    # Watchdog horario en minuto impar para evitar congestión de GitHub
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      cycles:
        description: 'Número de ciclos a ejecutar'
        required: false
        default: '15'

concurrency:
  group: oci-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: Claim Free Tier Instance (Madrid)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute OCI Hunter
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
          OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
          OCI_INSTANCE_PUB_KEY: ${{ secrets.OCI_INSTANCE_PUB_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_CYCLES: ${{ github.event.inputs.cycles || '15' }}
          MAX_DURATION_SECONDS: '1500'
        run: |
          python hunter.py

      - name: Auto-relevo continuo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f instance_created.txt ]; then
            echo "🎉 Instancia creada con éxito. Deteniendo relevos."
          else
            echo "Sin hueco libre en este bloque. Relanzando relevo inmediatamente..."
            sleep 10
            gh workflow run oci_retry.yml -R PabloDiaZzz/oracle-vps-hunter
          fi
